name: CI

# Runs on pull requests (and by hand). Not on pushes to master: the branch
# ruleset only merges PRs that are up to date with master and passed
# `build-and-test`, so master gets exactly the code CI already checked —
# a post-merge run would only rebuild it. Releases run their own tests.
on:
  pull_request:
  workflow_dispatch:

jobs:
  # Docs, website and README changes don't need a macOS build. A cheap job
  # decides; `build-and-test` (a required status check) is then skipped,
  # which GitHub counts as passing, so docs-only PRs still merge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # No usable base (manual run): build.
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$BASE" HEAD)"
          printf '%s\n' "$changed"
          if grep -qE '^(sources/|guest/|scripts/|Package\.swift$|Package\.resolved$|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No code changes — skipping the macOS build."
          fi

  build-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # GitHub's macOS runners ship full Xcode, so the SwiftUIMacros plugin is
      # present and no SDK pin is needed (the build script's pin only kicks in
      # on Command-Line-Tools-only machines).
      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        run: swift run -c release DockzApp test
